name: Compilar e Publicar APK SAMU 192 Orlandia

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'base_dados_samu.json'
      - 'github-database/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: build-samu-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e Build-Tools (API 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMGR" ]]; then
            SDKMGR=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [[ -z "$SDKMGR" || ! -x "$SDKMGR" ]]; then
            SDKMGR=$(command -v sdkmanager || true)
          fi

          if [[ ! -f "$SDK_ROOT/platforms/android-34/android.jar" || ! -f "$SDK_ROOT/build-tools/34.0.0/aapt2" ]]; then
            echo "Instalando platforms;android-34 e build-tools;34.0.0 via $SDKMGR..."
            yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
            "$SDKMGR" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "Android SDK 34 e Build-Tools 34.0.0 pre-instalados em $SDK_ROOT."
          fi

      - name: Restaurar certificado de assinatura via GitHub Secret (se configurado)
        env:
          SAMU_KEYSTORE_BASE64: ${{ secrets.SAMU_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$SAMU_KEYSTORE_BASE64" ]]; then
            echo "$SAMU_KEYSTORE_BASE64" | base64 -d > android-project/samu_orlandia_release.jks
          fi

      - name: Compilar e Assinar SAMU_192_Orlandia.apk
        run: |
          python3 android-project/build_apk_ci.py

      - name: Disponibilizar APK nos Artefatos da Execução
        uses: actions/upload-artifact@v4
        with:
          name: SAMU_192_Orlandia_APK
          path: |
            SAMU_192_Orlandia.apk
            version.json

      - name: Publicar Release Oficial p/ Auto-Update dos Celulares
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER_NAME=$(python3 -c "import json; d=json.load(open('version.json')); print(d.get('apkVersionName','1.0.0'))")
          VER_CODE=$(python3 -c "import json; d=json.load(open('version.json')); print(d.get('apkVersionCode',1))")
          OTA_REV=$(python3 -c "import json; d=json.load(open('version.json')); print(d.get('otaRevision',1))")
          NOTES=$(python3 -c "import json; d=json.load(open('version.json')); print(d.get('releaseNotes','Atualização automática SAMU 192 Orlândia-SP'))")
          TAG="v${VER_NAME}-b${VER_CODE}-r${OTA_REV}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            HAS_APK=$(gh release view "$TAG" --json assets -q '.assets[].name' | grep -Fx "SAMU_192_Orlandia.apk" || true)
            if [[ -z "$HAS_APK" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              gh release upload "$TAG" SAMU_192_Orlandia.apk version.json --clobber
            else
              echo "Release $TAG ja possui SAMU_192_Orlandia.apk publicado pela compilacao local."
            fi
          else
            gh release create "$TAG" SAMU_192_Orlandia.apk version.json \
              --title "SAMU 192 Orlândia v${VER_NAME} (Build ${VER_CODE} • Rev #${OTA_REV})" \
              --notes "${NOTES}" \
              --latest
          fi
